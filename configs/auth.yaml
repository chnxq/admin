authn:
  type: "jwt" # jwt, oidc, preshared_key

  jwt:
    method: "HS256" # HS256, HS384, HS512, RS256, RS384, RS512, ES256, ES384, ES512, Ed25519
    key: "some_api_key"

  oidc:
    issuer_url: "https://example.com"
    audience: "your_audience"
    method: "HS256"

  preshared_key:
    valid_keys:
      - "key1"
      - "key2"

  registration:
    default_tenant_id: 1
    default_tenant_code: "default"
    default_role_code: "GUEST"
    default_org_unit_code: "UNDEFINED"
    default_position_code: "UNDEFINED"

  social_auth:
    github:
      enabled: false
      client_id: "your-github-client-id"
      client_secret: "your-github-client-secret"
      redirect_uri: "http://localhost:5666/auth/social/callback/github"
      auth_url: "https://github.com/login/oauth/authorize"
      token_url: "https://github.com/login/oauth/access_token"
      user_api_url: "https://api.github.com/user"
      scopes:
        - "read:user"
        - "user:email"
    dingtalk:
      enabled: false
      client_id: "your-dingtalk-client-id"
      client_secret: "your-dingtalk-client-secret"
      redirect_uri: "http://localhost:5666/auth/social/callback/dingtalk"
      auth_url: "https://login.dingtalk.com/oauth2/auth"
      token_url: "https://api.dingtalk.com/v1.0/oauth2/userAccessToken"
      user_api_url: "https://api.dingtalk.com/v1.0/contact/users/me"
      scopes:
        - "openid"
    wechat_web:
      enabled: false
      client_id: "your-wechat-web-app-id"
      client_secret: "your-wechat-web-client-secret"
      redirect_uri: "http://localhost:5666/auth/social/callback/wechat"
      auth_url: "https://open.weixin.qq.com/connect/qrconnect"
      token_url: "https://api.weixin.qq.com/sns/oauth2/access_token"
      user_api_url: "https://api.weixin.qq.com/sns/userinfo"
      scopes:
        - "snsapi_login"
    wechat_miniapp:
      enabled: false
      client_id: ""
      client_secret: ""
      redirect_uri: ""
      auth_url: ""
      token_url: "https://api.weixin.qq.com/sns/jscode2session"
      user_api_url: ""
      scopes:
        - "snsapi_base"
    alipay:
      enabled: false
      client_id: ""
      client_secret: ""
      redirect_uri: ""
      auth_url: "https://openauth.alipay.com/oauth2/publicAppAuthorize.htm"
      token_url: "https://openapi.alipay.com/gateway.do"
      user_api_url: "https://openapi.alipay.com/gateway.do"
      scopes:
        - "auth_user"
    douyin:
      enabled: false
      client_id: ""
      client_secret: ""
      redirect_uri: ""
      auth_url: "https://open.douyin.com/platform/oauth/connect/"
      token_url: "https://open.douyin.com/oauth/access_token/"
      user_api_url: "https://open.douyin.com/oauth/userinfo/"
      scopes:
        - "user_info"

authz:
  type: "casbin" # casbin, opa, zanzibar, noop

  casbin:

  opa:

  zanzibar:
    type: "keto" # keto, open_fga

    keto:
      write_url: "http://keto:4466"
      read_url: "http://keto:4466"
      use_grpc: true

    open_fga:
      api_url: "http://openfga:8080"
      store_id: "your_store_id"
      token: "your_token"
