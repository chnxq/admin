logger:
  type: "zap" # Options: std, file, fluent, zap, logrus, aliyun, tencent

  fluent:
    endpoint: "tcp://localhost:24224"

  zap:
    level: "debug"
    log_file_path: "./logfile"
    caller: "xkit"
    log_to_console: true
    export_to_otel: false
    max_size: 1
    max_age: 10
    max_backups: 5
    exporter_endpoint: "localhost:4317"
    exporter_insecure: true

  logrus:
    level: "debug"
    formatter: "text"
    timestamp_format: "2006-01-02 15:04:05"
    disable_colors: false
    disable_timestamp: false

  aliyun:
    endpoint: ""
    project: ""
    access_key: "<access_key>"
    access_secret: "<access_secret>"

  tencent:
    endpoint: ""
    topic_id:
    access_key: "<access_key>"
    access_secret: "<access_secret>"